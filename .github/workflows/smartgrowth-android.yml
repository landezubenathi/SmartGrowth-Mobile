name: SmartGrowth Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/smartgrowth-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install npm dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Validate standalone calculations
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap tests/*.test.mjs 2>&1 | tee smartgrowth-test-results.log
      - name: Upload test report even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartgrowth-test-results
          path: smartgrowth-test-results.log
          if-no-files-found: ignore
      - name: Validate Firebase project configuration
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
        run: node scripts/verify_firebase_config.mjs
      - name: Build web app
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_TREASURY_PROXY_URL: ${{ vars.REACT_APP_TREASURY_PROXY_URL }}
        run: npm run build
      - name: Upload installable web bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartgrowth-static-web
          path: frontend/build
      - name: Prepare Capacitor Android project
        working-directory: frontend
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smartgrowth-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
